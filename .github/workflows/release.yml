name: Auto Release

# Push rule: on every push to main, bump the latest version tag incrementally
# (patch by default, minor on `feat:`, major on BREAKING) and create a GitHub
# release with the commit log since the last tag. No packaging is performed.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest" ]; then
            echo "next=v0.1.0"
            echo "changelog<<EOF"
            git log --pretty=format:'* %s' --no-merges
            echo ""
            echo "EOF"
            exit 0
          fi
          # Skip when HEAD is already tagged (idempotency on re-push)
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "skip=true"
            exit 0
          fi
          IFS='.' read -r major minor patch <<< "${latest#v}"
          commits=$(git log --pretty=format:'%s' "${latest}..HEAD")
          if echo "$commits" | grep -qE '^BREAKING|!:' || echo "$commits" | grep -qE 'BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$commits" | grep -qE '^feat(\(|:)'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "next=v${major}.${minor}.${patch}"
          echo "changelog<<EOF"
          echo "$commits" | sed 's/^/* /'
          echo "EOF"

      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.next }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$version" -m "Release $version"
          git push origin "$version"
          gh release create "$version" --title "Release $version" \
            --notes "${{ steps.version.outputs.changelog }}"
