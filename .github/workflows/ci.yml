name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests (PHPUnit 9 on PHP 8.0)
        if: matrix.php == '8.0'
        run: vendor/bin/phpunit -c phpunit-9.xml

      - name: Run tests
        if: matrix.php != '8.0'
        run: vendor/bin/phpunit

      # The no-framework example is documentation that executes: it fails the
      # build when an invariant it documents stops holding.
      - name: Run the plain-PHP example
        if: matrix.php == '8.3'
        run: php docs/examples/plain-php.php

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpstan.neon.dist stubs the Laravel / ThinkPHP / Hyperf symbols the
      # adapters touch, so this passes with none of them installed.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  diagrams:
    name: Diagrams up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate every localized diagram
        run: python3 scripts/generate-diagrams.py

      - name: Fail when the committed SVGs are stale
        run: |
          if ! git diff --quiet -- docs/i18n/img; then
            echo "::error::docs/i18n/img is out of date - run 'python3 scripts/generate-diagrams.py' and commit the result"
            git diff --stat -- docs/i18n/img
            exit 1
          fi
