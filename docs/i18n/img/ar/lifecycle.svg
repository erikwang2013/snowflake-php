<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 924" width="980" height="924" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>دورة حياة الـ ID</title>
<desc>استدعاء id() واحد: المسار الكامل، والحالة التي يلمسها، والحدود التي يحترمها</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="924" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">دورة حياة الـ ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">استدعاء id() واحد: المسار الكامل، والحالة التي يلمسها، والحدود التي يحترمها</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">بنية الـ ID (64 بت افتراضيًا)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">الطابع الزمني 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">التسلسل 12</text>
<text x="666" y="208" font-size="9.5" fill="#6b7c96" font-weight="400">بت الإشارة 1 (دائمًا 0)؛ الطابع الزمني = ميلي</text>
<text x="666" y="223" font-size="9.5" fill="#6b7c96" font-weight="400">ثانية منذ الـ epoch</text>
<text x="666" y="238" font-size="9.5" fill="#6b7c96" font-weight="400">5 بتات للـ datacenter × 5 للـ worker = 32 × 32</text>
<text x="666" y="253" font-size="9.5" fill="#6b7c96" font-weight="400">= 1024 عقدة</text>
<text x="666" y="268" font-size="9.5" fill="#6b7c96" font-weight="400">التسلسل 12 بت = 4096 معرّفًا لكل ميلي ثانية</text>
<text x="666" y="283" font-size="9.5" fill="#6b7c96" font-weight="400">(التوزيع الافتراضي)</text>
<rect x="650.0" y="324.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="13.0" fill="#0f1e33" font-weight="700">حالة النسخة (محفوظة بين الاستدعاءات)</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — ميلي ثانية المعرّف السابق،</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">تُستخدم لفحص الارتداد والاستنفاد</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — مؤشّر التسلسل للميلي</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">ثانية الحالية (seq / lastTs)</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — بتات العقدة ووقت</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">البداية، للقراءة فقط بعد البناء</text>
<text x="666" y="498" font-size="7.7" fill="#dc2626" font-weight="600">تنبيه: لا يجوز مشاركة النسخة بين العمليات أو الـ coroutines</text>
<rect x="650.0" y="528.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="528.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="552" font-size="13.0" fill="#0f1e33" font-weight="700">السعة والإنتاجية</text>
<text x="665" y="574.0" font-size="11.5" fill="#3d4d66" font-weight="400">4096 معرّفًا كحد أقصى (2^12) لكل ميلي</text>
<text x="665" y="591.25" font-size="11.5" fill="#3d4d66" font-weight="400">ثانية؛ وبعدها ينتظر حتى الميلي ثانية</text>
<text x="665" y="608.5" font-size="11.5" fill="#3d4d66" font-weight="400">التالية.</text>
<text x="665" y="625.75" font-size="11.5" fill="#3d4d66" font-weight="400">نحو 500 ألف معرّف في الثانية في العملية</text>
<text x="665" y="643.0" font-size="11.5" fill="#3d4d66" font-weight="400">الواحدة.</text>
<text x="665" y="660.25" font-size="11.5" fill="#3d4d66" font-weight="400">تحجز كل عقدة زوجًا فريدًا (datacenter_id,</text>
<text x="665" y="677.5" font-size="11.5" fill="#3d4d66" font-weight="400">worker_id)؛ والتوزيع الافتراضي يتيح 32 × 32</text>
<text x="665" y="694.75" font-size="11.5" fill="#3d4d66" font-weight="400">= 1024 عقدة.</text>
<rect x="650.0" y="708.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="708.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="732" font-size="13.0" fill="#0f1e33" font-weight="700">الخط الزمني للعمر</text>
<rect x="670.0" y="762.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="762.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="758.0" x2="678.8" y2="777.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="753" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="753" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">الحد 2093</text>
<text x="670" y="798" font-size="10.5" fill="#3d4d66" font-weight="400">البداية: epoch = 2024-01-01 UTC</text>
<text x="670" y="814" font-size="10.5" fill="#3d4d66" font-weight="400">الحد: 2^41 − 1 ms ≈ 69.7 سنة</text>
<text x="670" y="830" font-size="10.5" fill="#3d4d66" font-weight="400">الاستنفاد يُطلق TimestampOverflowException</text>
<text x="670" y="846" font-size="10.5" fill="#3d4d66" font-weight="400">epoch أحدث يعيد ضبط العمر كاملًا.</text>
<text x="670" y="874" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">نحو 3% مستهلكة بحلول 2026</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">استدعِ id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">اقرأ الميلي ثانية الحالية؛ فهي الأساس الزمني لهذا المعرّف.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">لا</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (تراجعت الساعة)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">نعم ← إذا كان الانحراف ضمن clock_tolerance_ms تُعاد الميلي</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">ثانية السابقة؛ وإلا يُطلق ClockDriftException ويُرفض التوليد.</text>
<path d="M350.0,376.0 L350.0,400.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="400.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="429.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="469" font-size="10.5" fill="#b45309" font-weight="400">offset هي المسافة بالمللي ثانية من الـ epoch المضبوط.</text>
<path d="M350.0,469.0 L350.0,493.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="485.0" font-size="10.5" fill="#6b7c96" font-weight="600">لا</text>
<polygon points="350,493.0 500.0,527.0 350,561.0 200.0,527.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="524.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">هل offset خارج النطاق؟</text>
<text x="350" y="540.0" font-size="10.5" fill="#6b7c96" font-weight="400" text-anchor="middle">(أقل من 0 أو فوق الحد)</text>
<text x="178" y="580" font-size="10.5" fill="#b45309" font-weight="400">نعم ← ساعة قبل الـ epoch تُطلق ClockDriftException؛ وepoch</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">مستنفد يُطلق TimestampOverflowException.</text>
<path d="M350.0,596.0 L350.0,620.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="620.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="649.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="689" font-size="10.5" fill="#b45309" font-weight="400">عند استنفاد التسلسل (null) ينتظر حتى الميلي ثانية التالية ويعيد</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">المحاولة مرة واحدة، ثم يفشل بـ RuntimeException.</text>
<path d="M350.0,705.0 L350.0,729.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="729.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="758.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t؛ جمّع المعرّف</text>
<text x="178" y="798" font-size="10.5" fill="#b45309" font-weight="400">لا تتقدّم الحالة إلا بعد اجتياز كل الفحوص، فلا يُفسد استدعاء</text>
<text x="178" y="814" font-size="10.5" fill="#b45309" font-weight="400">فاشل الاستدعاء التالي.</text>
<path d="M350.0,814.0 L350.0,838.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="838.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="861.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">أعِد معرّفًا فريدًا بحجم 64 بت</text>
</svg>
