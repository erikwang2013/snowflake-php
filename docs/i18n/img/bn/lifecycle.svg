<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 942" width="980" height="942" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>ID লাইফসাইকেল</title>
<desc>একটি id() কল: সম্পূর্ণ পথ, যে স্টেট স্পর্শ করে, আর যে লিমিট মানে</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="942" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">ID লাইফসাইকেল</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">একটি id() কল: সম্পূর্ণ পথ, যে স্টেট স্পর্শ করে, আর যে লিমিট মানে</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">ID লেআউট (ডিফল্টে 64 বিট)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="666" y="208" font-size="9.5" fill="#6b7c96" font-weight="400">সাইন বিট 1 (সবসময় 0); timestamp = epoch</text>
<text x="666" y="223" font-size="9.5" fill="#6b7c96" font-weight="400">থেকে মিলিসেকেন্ড</text>
<text x="666" y="238" font-size="9.5" fill="#6b7c96" font-weight="400">Datacenter 5 বিট × worker 5 বিট = 32 × 32 =</text>
<text x="666" y="253" font-size="9.5" fill="#6b7c96" font-weight="400">1024 নোড</text>
<text x="666" y="268" font-size="9.5" fill="#6b7c96" font-weight="400">Sequence 12 বিট = প্রতি মিলিসেকেন্ডে</text>
<text x="666" y="283" font-size="9.5" fill="#6b7c96" font-weight="400">4096 ID (ডিফল্ট লেআউট)</text>
<rect x="650.0" y="324.0" width="290.0" height="204.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="204.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="10.9" fill="#0f1e33" font-weight="700">ইনস্ট্যান্স স্টেট (কলজুড়ে সংরক্ষিত)</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — আগের ID-র মিলিসেকেন্ড,</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">ড্রিফট ও এক্সহশন চেকের জন্য</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — চলতি মিলিসেকেন্ডের</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequence কার্সর (seq / lastTs)</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — node বিট ও শুরুর</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">সময়, কনস্ট্রাকশনের পর রিড-অনলি</text>
<text x="666" y="486.0" font-size="10.5" fill="#dc2626" font-weight="600">নোট: একটি ইনস্ট্যান্স কখনো প্রসেস বা</text>
<text x="666" y="500.175" font-size="10.5" fill="#dc2626" font-weight="600">করুটিনের মধ্যে শেয়ার করা যাবে না</text>
<rect x="650.0" y="546.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="546.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="570" font-size="13.0" fill="#0f1e33" font-weight="700">ক্যাপাসিটি ও থ্রুপুট</text>
<text x="665" y="592.0" font-size="11.5" fill="#3d4d66" font-weight="400">সর্বোচ্চ 2^12 = 4096 ID প্রতি</text>
<text x="665" y="609.25" font-size="11.5" fill="#3d4d66" font-weight="400">মিলিসেকেন্ড; এর বেশি হলে পরের</text>
<text x="665" y="626.5" font-size="11.5" fill="#3d4d66" font-weight="400">মিলিসেকেন্ডে স্পিন করে।</text>
<text x="665" y="643.75" font-size="11.5" fill="#3d4d66" font-weight="400">একক প্রসেসে সেকেন্ডে প্রায় 500k ID।</text>
<text x="665" y="661.0" font-size="11.5" fill="#3d4d66" font-weight="400">প্রতিটি node একটি ইউনিক (datacenter_id,</text>
<text x="665" y="678.25" font-size="11.5" fill="#3d4d66" font-weight="400">worker_id) জোড়া নেয়; ডিফল্ট লেআউটে</text>
<text x="665" y="695.5" font-size="11.5" fill="#3d4d66" font-weight="400">32 × 32 = 1024 node।</text>
<rect x="650.0" y="726.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="726.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="750" font-size="13.0" fill="#0f1e33" font-weight="700">লাইফটাইম টাইমলাইন</text>
<rect x="670.0" y="780.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="780.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="776.0" x2="678.8" y2="795.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="771" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="771" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">লিমিট 2093</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">শুরু: epoch = 2024-01-01 UTC</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">লিমিট: 2^41 − 1 ms ≈ 69.7 বছর</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">এক্সহশন হলে TimestampOverflowException</text>
<text x="670" y="864" font-size="10.5" fill="#3d4d66" font-weight="400">থ্রো হয়</text>
<text x="670" y="880" font-size="10.5" fill="#3d4d66" font-weight="400">নতুন epoch দিলে পুরো লাইফস্প্যান আবার</text>
<text x="670" y="896" font-size="10.5" fill="#3d4d66" font-weight="400">শুরু হয়।</text>
<text x="670" y="924" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">2026-এ প্রায় 3% ব্যবহৃত</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">id() / nextId() কল করুন</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">চলতি মিলিসেকেন্ড পড়া হয়; এটিই এই ID-র টাইম বেস।</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">না</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="11.4" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (ক্লক পিছিয়ে গেছে)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">হ্যাঁ → ড্রিফট clock_tolerance_ms-এর মধ্যে থাকলে আগের</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">মিলিসেকেন্ডই ব্যবহার হয়; নাহলে ClockDriftException থ্রো</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">করে জেনারেশন বন্ধ করে।</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset হলো কনফিগার করা epoch থেকে মিলিসেকেন্ডের</text>
<text x="178" y="501" font-size="10.5" fill="#b45309" font-weight="400">দূরত্ব।</text>
<path d="M350.0,501.0 L350.0,525.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="517.0" font-size="10.5" fill="#6b7c96" font-weight="600">না</text>
<polygon points="350,525.0 500.0,559.0 350,593.0 200.0,559.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="556.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset রেঞ্জের বাইরে?</text>
<text x="350" y="572.0" font-size="9.7" fill="#6b7c96" font-weight="400" text-anchor="middle">(0-এর নিচে বা লিমিটের উপরে)</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">হ্যাঁ → epoch-এর আগের সময় হলে ClockDriftException; epoch</text>
<text x="178" y="628" font-size="10.5" fill="#b45309" font-weight="400">শেষ হলে TimestampOverflowException।</text>
<path d="M350.0,628.0 L350.0,652.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="652.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="681.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">sequence শেষ হলে (null) পরের মিলিসেকেন্ডে স্পিন করে</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">একবার রিট্রাই করে, তারপর RuntimeException দেয়।</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; ID অ্যাসেম্বল করা হয়</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">সব গার্ড পাস করার পরেই স্টেট এগোয়, তাই ব্যর্থ কল</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">পরেরটিকে নষ্ট করতে পারে না।</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">64-bit ইউনিক ID রিটার্ন করে</text>
</svg>
