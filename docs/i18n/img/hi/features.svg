<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>फ़ीचर डिज़ाइन</title>
<desc>तीन capability domains, नौ core features</desc>
<defs>
</defs>
<rect width="980" height="820" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">फ़ीचर डिज़ाइन</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">तीन capability domains, नौ core features</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="133.3" height="28.0" rx="14.0" fill="#2563eb"/><text x="122.63125" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Core क्षमताएँ</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Unique ID जनरेशन</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64-bit, k-ordered, globally unique;</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">बिना central coordinator और database</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">round-trip के हर process में प्रति</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">सेकंड दस लाख से कहीं ज़्यादा</text>
<text x="71.0" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">IDs।</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">लचीला bit allocation</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">timestamp, datacenter, worker और</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">sequence की चौड़ाई configurable है;</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">default 5+5+12 layout 1024 nodes</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">support करता है। timestamp से लिए</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">गए bits lifespan घटा देते हैं;</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">Snowflake::lifespanMs() उसे बताता</text>
<text x="71.0" y="547.5" font-size="11.5" fill="#3d4d66" font-weight="400">है।</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">ID पार्सिंग</text>
<rect x="71.0" y="604.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">किसी भी बनी ID को उसके timestamp,</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">datacenter, worker और sequence</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">हिस्सों में decompose करें —</text>
<text x="71.0" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">debugging और sharding के लिए</text>
<text x="71.0" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">उपयोगी।</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="160.8" height="28.0" rx="14.0" fill="#0e7490"/><text x="443.0791666666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Extension के बिंदु</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="12.5" fill="#0f1e33" font-weight="700">बदलने योग्य sequence strategies</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">sequence resolver एक interface है;</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">sequential, random और Redis-backed</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">implementations built-in हैं, और</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">बाक़ी कुछ भी बस कुछ lines दूर</text>
<text x="377.6666666666667" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">है।</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Clock drift सुरक्षा</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">configurable tolerance window NTP jitter</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">सोख लेती है। उससे आगे</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">clock_drift_strategy तय करता है: &#x27;wait&#x27;</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">clock आने तक spin करता है, &#x27;throw&#x27;</text>
<text x="377.6666666666667" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">मना करता है।</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Framework adapters</text>
<rect x="377.7" y="604.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Laravel, Webman, ThinkPHP और Hyperf</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">adapters built-in हैं, और PSR-11</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">factory कोई भी दूसरा container</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">cover करती है — या container</text>
<text x="377.6666666666667" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">छोड़कर सीधा plain PHP।</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="123.3" height="28.0" rx="14.0" fill="#6d28d9"/><text x="730.9770833333333" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">इंजीनियरिंग</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">सख़्त config validation</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">config arrays, config files और</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">environment variables सब एक ही</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">validated factory में आते हैं, जो</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">असंभव combinations अस्वीकार करती</text>
<text x="684.3333333333334" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">है।</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Semantic exceptions</text>
<rect x="684.3" y="410.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">पाँच exception types, हर एक गड़बड़</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">value और उसकी limit बताता है, ताकि</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">message सीधे misconfiguration पर</text>
<text x="684.3333333333334" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">इशारा करे।</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Quality और delivery</text>
<rect x="684.3" y="604.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">पूरी PHPUnit suite, CI में PHP</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">8.0-8.5, src/ पर PHPStan level 8, और</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">main पर हर push पर automatic</text>
<text x="684.3333333333334" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">versioning।</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">Runtime: PHP &gt;= 8.0 (CI में 8.0 – 8.5) · 64-bit system · हर process या coroutine के लिए एक instance, sequence state कभी साझा नहीं</text>
</svg>
