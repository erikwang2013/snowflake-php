<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 942" width="980" height="942" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>ID लाइफ़साइकल</title>
<desc>एक id() call: पूरा रास्ता, छुई जाने वाली state, और मानी जाने वाली limits</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="942" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">ID लाइफ़साइकल</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">एक id() call: पूरा रास्ता, छुई जाने वाली state, और मानी जाने वाली limits</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">ID layout (default 64 bits)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="666" y="208" font-size="9.5" fill="#6b7c96" font-weight="400">Sign bit 1 (हमेशा 0); timestamp = epoch से</text>
<text x="666" y="223" font-size="9.5" fill="#6b7c96" font-weight="400">milliseconds</text>
<text x="666" y="238" font-size="9.5" fill="#6b7c96" font-weight="400">Datacenter 5 bits × worker 5 bits = 32 × 32 =</text>
<text x="666" y="253" font-size="9.5" fill="#6b7c96" font-weight="400">1024 nodes</text>
<text x="666" y="268" font-size="9.5" fill="#6b7c96" font-weight="400">Sequence 12 bits = 4096 IDs प्रति millisecond</text>
<text x="666" y="283" font-size="9.5" fill="#6b7c96" font-weight="400">(default layout)</text>
<rect x="650.0" y="324.0" width="290.0" height="204.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="204.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="11.3" fill="#0f1e33" font-weight="700">Instance state (calls के बीच बनी रहती है)</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — पिछली ID का millisecond,</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">drift और exhaustion check के लिए</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — मौजूदा millisecond का</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequence cursor (seq / lastTs)</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — node bits और start time,</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">construction के बाद read-only</text>
<text x="666" y="486.0" font-size="10.5" fill="#dc2626" font-weight="600">नोट: instance processes या coroutines के बीच</text>
<text x="666" y="500.175" font-size="10.5" fill="#dc2626" font-weight="600">कभी साझा न करें</text>
<rect x="650.0" y="546.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="546.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="570" font-size="13.0" fill="#0f1e33" font-weight="700">क्षमता और throughput</text>
<text x="665" y="592.0" font-size="11.5" fill="#3d4d66" font-weight="400">अधिकतम 2^12 = 4096 IDs प्रति</text>
<text x="665" y="609.25" font-size="11.5" fill="#3d4d66" font-weight="400">millisecond; उससे ज़्यादा पर अगले</text>
<text x="665" y="626.5" font-size="11.5" fill="#3d4d66" font-weight="400">millisecond तक spin।</text>
<text x="665" y="643.75" font-size="11.5" fill="#3d4d66" font-weight="400">एक process में लगभग 500k IDs प्रति</text>
<text x="665" y="661.0" font-size="11.5" fill="#3d4d66" font-weight="400">सेकंड।</text>
<text x="665" y="678.25" font-size="11.5" fill="#3d4d66" font-weight="400">हर node एक unique (datacenter_id, worker_id)</text>
<text x="665" y="695.5" font-size="11.5" fill="#3d4d66" font-weight="400">pair लेता है; default layout 32 × 32 =</text>
<text x="665" y="712.75" font-size="11.5" fill="#3d4d66" font-weight="400">1024 nodes देता है।</text>
<rect x="650.0" y="726.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="726.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="750" font-size="13.0" fill="#0f1e33" font-weight="700">जीवनकाल timeline</text>
<rect x="670.0" y="780.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="780.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="776.0" x2="678.8" y2="795.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="771" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="771" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">limit 2093</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">शुरुआत: epoch = 2024-01-01 UTC</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">सीमा: 2^41 − 1 ms ≈ 69.7 वर्ष</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">समाप्त होने पर TimestampOverflowException</text>
<text x="670" y="864" font-size="10.5" fill="#3d4d66" font-weight="400">throw होता है</text>
<text x="670" y="880" font-size="10.5" fill="#3d4d66" font-weight="400">नया epoch पूरा lifespan फिर से शुरू कर</text>
<text x="670" y="896" font-size="10.5" fill="#3d4d66" font-weight="400">देता है।</text>
<text x="670" y="924" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">2026 तक लगभग 3% खर्च</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">id() / nextId() call करें</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">मौजूदा millisecond पढ़ें; यही इस ID का time base है।</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">नहीं</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.0" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (clock पीछे चली गई)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">हाँ → drift clock_tolerance_ms के अंदर हो तो पिछला</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">millisecond दोबारा इस्तेमाल करें; वरना ClockDriftException</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">throw करें और ID न बनाएँ।</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset configured epoch से milliseconds में दूरी है।</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">नहीं</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">Offset range से बाहर?</text>
<text x="350" y="556.0" font-size="10.5" fill="#6b7c96" font-weight="400" text-anchor="middle">(0 से नीचे या limit से ऊपर)</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">हाँ → epoch से पहले की clock ClockDriftException throw करती</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">है; ख़त्म epoch TimestampOverflowException।</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">sequence ख़त्म (null) होने पर अगले millisecond तक spin होता</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">है और एक बार फिर कोशिश, फिर RuntimeException।</text>
<path d="M350.0,721.0 L350.0,745.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="745.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="774.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; ID assemble करें</text>
<text x="178" y="814" font-size="10.5" fill="#b45309" font-weight="400">state तभी आगे बढ़ती है जब हर guard पास हो, इसलिए fail</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">हुई call अगली को ख़राब नहीं कर सकती।</text>
<path d="M350.0,830.0 L350.0,854.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="854.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="877.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">64-bit unique ID return करें</text>
</svg>
