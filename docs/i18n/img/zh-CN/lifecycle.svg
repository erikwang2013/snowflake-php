<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 950" width="980" height="950" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>ID 生命周期</title>
<desc>单次 id() 调用的完整流程、实例状态与容量边界</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="950" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">ID 生命周期</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">单次 id() 调用的完整流程、实例状态与容量边界</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">ID 位结构（默认 64 位）</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">时间戳 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="666" y="208" font-size="10.5" fill="#6b7c96" font-weight="400">符号位 1 位恒为 0；时间戳为相对 epoch 的毫秒偏移</text>
<text x="666" y="223" font-size="10.5" fill="#6b7c96" font-weight="400">数据中心 5 位 × 节点 5 位 = 32 × 32 = 1024 个</text>
<text x="666" y="238" font-size="10.5" fill="#6b7c96" font-weight="400">节点</text>
<text x="666" y="253" font-size="10.5" fill="#6b7c96" font-weight="400">序列 12 位 = 单毫秒 4096 个 ID（默认布局）</text>
<rect x="650.0" y="324.0" width="290.0" height="204.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="204.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="13.0" fill="#0f1e33" font-weight="700">实例状态（跨调用保持）</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — 上一次生成的毫秒，用于回拨与</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">序列耗尽判断</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — 当前毫秒的序列游标（seq /</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">lastTs）</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — 构造后只读的节点位与起始</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">时间</text>
<text x="666" y="486.0" font-size="10.5" fill="#dc2626" font-weight="600">注意：实例不可跨进程或协程共享</text>
<rect x="650.0" y="546.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="546.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="570" font-size="13.0" fill="#0f1e33" font-weight="700">容量与吞吐</text>
<text x="665" y="592.0" font-size="11.5" fill="#3d4d66" font-weight="400">单毫秒最多 2^12 = 4096 个 ID；耗尽则自旋等</text>
<text x="665" y="609.25" font-size="11.5" fill="#3d4d66" font-weight="400">待下一毫秒。</text>
<text x="665" y="626.5" font-size="11.5" fill="#3d4d66" font-weight="400">单进程每秒可生成上百万个 ID。</text>
<text x="665" y="643.75" font-size="11.5" fill="#3d4d66" font-weight="400">多节点需按 (datacenter_id, worker_id) 唯一分配</text>
<text x="665" y="661.0" font-size="11.5" fill="#3d4d66" font-weight="400">，默认布局支持 32 × 32 = 1024 个节点。</text>
<rect x="650.0" y="726.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="726.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="750" font-size="13.0" fill="#0f1e33" font-weight="700">生命周期时间轴</text>
<rect x="670.0" y="780.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="780.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="776.0" x2="678.8" y2="795.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="771" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="771" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">2093 上限</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">起点：epoch = 2024-01-01 UTC</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">上限：2^41 − 1 ms ≈ 69.7 年</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">耗尽抛 TimestampOverflowException</text>
<text x="670" y="864" font-size="10.5" fill="#3d4d66" font-weight="400">换用更近的 epoch 可重置年限。</text>
<text x="670" y="892" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">当前（2026）已消耗约 3%</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">调用 id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">取当前毫秒，作为本次生成的时间基准</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">否</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp（时钟回拨）</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">是 → 回拨在 clock_tolerance_ms 内则复用上一毫秒；超出后由</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">clock_drift_strategy 决定：&#x27;wait&#x27; 自旋等待追平，&#x27;throw&#x27; 抛出</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">ClockDriftException。</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset 为相对起始时间（epoch）的毫秒偏移量</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">否</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset 越界？</text>
<text x="350" y="556.0" font-size="10.5" fill="#6b7c96" font-weight="400" text-anchor="middle">（小于 0 或超过上限）</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">是 → 时钟早于 epoch 抛 ClockDriftException；epoch 耗尽抛</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">TimestampOverflowException。</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">序列耗尽（null）时自旋等待下一毫秒并重试一次，仍失败抛</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">RuntimeException 提示降低生成速率。</text>
<path d="M350.0,721.0 L350.0,745.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="745.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="774.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t；位运算组装 ID</text>
<text x="178" y="814" font-size="10.5" fill="#b45309" font-weight="400">仅在全部校验通过后推进状态，失败调用不会污染下一次生成。</text>
<path d="M350.0,814.0 L350.0,838.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="838.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="861.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">返回 64 位唯一 ID</text>
</svg>
