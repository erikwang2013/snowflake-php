<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 910" width="980" height="910" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Cycle de vie d&#x27;un ID</title>
<desc>Un appel id() : le chemin complet, l&#x27;état touché et les limites respectées</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="910" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Cycle de vie d&#x27;un ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Un appel id() : le chemin complet, l&#x27;état touché et les limites respectées</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="172.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="172.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">Disposition de l&#x27;ID (64 bits par défaut)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">séquence 12</text>
<text x="666" y="208" font-size="10.5" fill="#6b7c96" font-weight="400">Bit de signe 1 (toujours 0) ; timestamp = millisecondes depuis l&#x27;epoch</text>
<text x="666" y="224" font-size="10.5" fill="#6b7c96" font-weight="400">Datacenter 5 bits × worker 5 bits = 32 × 32 = 1024 nœuds</text>
<text x="666" y="240" font-size="10.5" fill="#6b7c96" font-weight="400">Séquence 12 bits = 4096 ID par milliseconde (disposition par défaut)</text>
<rect x="650.0" y="310.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="310.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="334" font-size="11.2" fill="#0f1e33" font-weight="700">État de l&#x27;instance (conservé entre les appels)</text>
<text x="665" y="356.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — milliseconde de l&#x27;ID</text>
<text x="665" y="373.25" font-size="11.5" fill="#3d4d66" font-weight="400">précédent, pour les contrôles de dérive et</text>
<text x="665" y="390.5" font-size="11.5" fill="#3d4d66" font-weight="400">d&#x27;épuisement</text>
<text x="665" y="407.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — curseur de séquence de</text>
<text x="665" y="425.0" font-size="11.5" fill="#3d4d66" font-weight="400">la milliseconde courante (seq / lastTs)</text>
<text x="665" y="442.25" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — bits de nœud et date de</text>
<text x="665" y="459.5" font-size="11.5" fill="#3d4d66" font-weight="400">départ, en lecture seule après construction</text>
<text x="666" y="484" font-size="7.5" fill="#dc2626" font-weight="600">Note : une instance ne doit jamais être partagée entre processus ou coroutines</text>
<rect x="650.0" y="514.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="514.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="538" font-size="13.0" fill="#0f1e33" font-weight="700">Capacité &amp; débit</text>
<text x="665" y="560.0" font-size="11.5" fill="#3d4d66" font-weight="400">Au plus 2^12 = 4096 ID par milliseconde ;</text>
<text x="665" y="577.25" font-size="11.5" fill="#3d4d66" font-weight="400">au-delà, attente de la milliseconde suivante.</text>
<text x="665" y="594.5" font-size="11.5" fill="#3d4d66" font-weight="400">Environ 500 k ID par seconde dans un</text>
<text x="665" y="611.75" font-size="11.5" fill="#3d4d66" font-weight="400">processus unique.</text>
<text x="665" y="629.0" font-size="11.5" fill="#3d4d66" font-weight="400">Chaque nœud revendique un couple</text>
<text x="665" y="646.25" font-size="11.5" fill="#3d4d66" font-weight="400">(datacenter_id, worker_id) unique ; 32 × 32 =</text>
<text x="665" y="663.5" font-size="11.5" fill="#3d4d66" font-weight="400">1024 nœuds avec la disposition par défaut.</text>
<rect x="650.0" y="694.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="694.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="718" font-size="13.0" fill="#0f1e33" font-weight="700">Chronologie de la durée de vie</text>
<rect x="670.0" y="748.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="748.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="744.0" x2="678.8" y2="763.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="739" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="739" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">limite 2093</text>
<text x="670" y="784" font-size="10.5" fill="#3d4d66" font-weight="400">Départ : epoch = 2024-01-01 UTC</text>
<text x="670" y="800" font-size="10.5" fill="#3d4d66" font-weight="400">Limite : 2^41 − 1 ms ≈ 69,7 ans</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">L&#x27;épuisement lève TimestampOverflowException</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">Un epoch plus récent réinitialise toute la durée</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">de vie.</text>
<text x="670" y="876" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">Environ 3 % consommés en 2026</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Appel id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Lit la milliseconde courante ; c&#x27;est la base temporelle de cet ID.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">Non</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (horloge reculée)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">Oui → si la dérive reste dans clock_tolerance_ms, réutilise la</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">milliseconde précédente ; sinon lève ClockDriftException et refuse</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">de générer.</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset est l&#x27;écart en millisecondes depuis l&#x27;epoch configuré.</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">Non</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">Offset hors plage ?</text>
<text x="350" y="556.0" font-size="10.2" fill="#6b7c96" font-weight="400" text-anchor="middle">(sous 0 ou au-delà de la limite)</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">Oui → une horloge antérieure à l&#x27;epoch lève ClockDriftException ;</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">un epoch épuisé lève TimestampOverflowException.</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">Quand la séquence est épuisée (null), attend la milliseconde</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">suivante et réessaie une fois, puis échoue avec une</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">RuntimeException.</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t ; assemblage de l&#x27;ID</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">L&#x27;état n&#x27;avance qu&#x27;une fois tous les contrôles passés : un appel</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">en échec ne corrompt pas le suivant.</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Renvoie un ID unique 64 bits</text>
</svg>
