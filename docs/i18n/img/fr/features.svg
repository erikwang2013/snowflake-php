<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Conception des fonctionnalités</title>
<desc>Trois domaines de capacités, neuf fonctionnalités clés</desc>
<defs>
</defs>
<rect width="980" height="820" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Conception des fonctionnalités</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Trois domaines de capacités, neuf fonctionnalités clés</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="141.9" height="28.0" rx="14.0" fill="#2563eb"/><text x="126.9625" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Capacités du cœur</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Génération d&#x27;ID uniques</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64 bits, k-ordonnés, globalement</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">uniques ; bien plus d&#x27;un million d&#x27;ID</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">par seconde et par processus, sans</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">coordinateur ni aller-retour en base.</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Allocation de bits flexible</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Les largeurs horodatage, datacenter,</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">worker et séquence sont configurables ;</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">la disposition 5+5+12 par défaut gère</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">1024 nœuds. Les bits pris sur</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">l&#x27;horodatage raccourcissent la durée de</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">vie ; Snowflake::lifespanMs() l&#x27;indique.</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Analyse d&#x27;ID</text>
<rect x="71.0" y="604.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Décomposez tout ID généré en</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">horodatage, datacenter, worker et</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">séquence — utile pour le débogage et le</text>
<text x="71.0" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">sharding.</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="140.6" height="28.0" rx="14.0" fill="#0e7490"/><text x="432.9729166666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Points d&#x27;extension</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="12.7" fill="#0f1e33" font-weight="700">Stratégies de séquence enfichables</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Le resolver de séquence est une</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">interface ; les stratégies séquentielle,</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">aléatoire et Redis sont fournies, le</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">reste tient en quelques lignes.</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Anti-dérive d&#x27;horloge</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Une fenêtre de tolérance configurable</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">absorbe la gigue NTP. Au-delà,</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">clock_drift_strategy décide : &#x27;wait&#x27;</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">attend que l&#x27;horloge rattrape, &#x27;throw&#x27;</text>
<text x="377.6666666666667" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">refuse de générer.</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Adapters de frameworks</text>
<rect x="377.7" y="604.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Les adapters Laravel, Webman,</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">ThinkPHP et Hyperf sont fournis, et la</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">fabrique PSR-11 couvre tout autre</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">conteneur — ou aucun, avec du PHP</text>
<text x="377.6666666666667" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">natif.</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="89.3" height="28.0" rx="14.0" fill="#6d28d9"/><text x="713.9802083333334" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Ingénierie</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Validation stricte de la config</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Tableaux, fichiers de config et</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">variables d&#x27;environnement convergent</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">vers une fabrique validée qui rejette</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">les combinaisons impossibles.</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Exceptions sémantiques</text>
<rect x="684.3" y="410.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Cinq types d&#x27;exceptions, chacun portant</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">la valeur fautive et sa limite, pour</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">pointer droit sur la mauvaise</text>
<text x="684.3333333333334" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">configuration.</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Qualité &amp; livraison</text>
<rect x="684.3" y="604.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Une suite PHPUnit complète, PHP</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">8.0–8.5 en CI, PHPStan niveau 8 sur</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">src/, et un versionnage automatique à</text>
<text x="684.3333333333334" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">chaque push sur main.</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">Runtime : PHP &gt;= 8.0 (CI 8.0 – 8.5) · système 64 bits · une instance par processus ou coroutine, l&#x27;état de séquence n&#x27;est jamais partagé</text>
</svg>
