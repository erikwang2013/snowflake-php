<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 910" width="980" height="910" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Жизненный цикл ID</title>
<desc>Один вызов id(): весь путь, затрагиваемое состояние и соблюдаемые лимиты</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="910" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Жизненный цикл ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Один вызов id(): весь путь, затрагиваемое состояние и соблюдаемые лимиты</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="172.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="172.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">Раскладка ID (64 бита по умолчанию)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">sequence 12</text>
<text x="666" y="208" font-size="10.5" fill="#6b7c96" font-weight="400">Знаковый бит 1 (всегда 0); timestamp = миллисекунды от эпохи</text>
<text x="666" y="224" font-size="10.5" fill="#6b7c96" font-weight="400">Датацентр 5 бит × воркер 5 бит = 32 × 32 = 1024 узла</text>
<text x="666" y="240" font-size="10.5" fill="#6b7c96" font-weight="400">Последовательность 12 бит = 4096 ID на миллисекунду (раскладка по умолчанию)</text>
<rect x="650.0" y="310.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="310.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="334" font-size="9.8" fill="#0f1e33" font-weight="700">Состояние экземпляра (хранится между вызовами)</text>
<text x="665" y="356.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — миллисекунда предыдущего</text>
<text x="665" y="373.25" font-size="11.5" fill="#3d4d66" font-weight="400">ID; нужна для проверки дрейфа и</text>
<text x="665" y="390.5" font-size="11.5" fill="#3d4d66" font-weight="400">исчерпания</text>
<text x="665" y="407.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — курсор</text>
<text x="665" y="425.0" font-size="11.5" fill="#3d4d66" font-weight="400">последовательности для текущей</text>
<text x="665" y="442.25" font-size="11.5" fill="#3d4d66" font-weight="400">миллисекунды (seq / lastTs)</text>
<text x="665" y="459.5" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — биты узла и время</text>
<text x="665" y="476.75" font-size="11.5" fill="#3d4d66" font-weight="400">старта, только для чтения после создания</text>
<text x="666" y="484" font-size="7.5" fill="#dc2626" font-weight="600">Важно: экземпляр нельзя разделять между процессами или корутинами</text>
<rect x="650.0" y="514.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="514.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="538" font-size="13.0" fill="#0f1e33" font-weight="700">Ёмкость и производительность</text>
<text x="665" y="560.0" font-size="11.5" fill="#3d4d66" font-weight="400">Не более 2^12 = 4096 ID на миллисекунду;</text>
<text x="665" y="577.25" font-size="11.5" fill="#3d4d66" font-weight="400">дальше — ожидание следующей миллисекунды.</text>
<text x="665" y="594.5" font-size="11.5" fill="#3d4d66" font-weight="400">Около 500 тыс. ID в секунду в одном</text>
<text x="665" y="611.75" font-size="11.5" fill="#3d4d66" font-weight="400">процессе.</text>
<text x="665" y="629.0" font-size="11.5" fill="#3d4d66" font-weight="400">Узлы занимают уникальную пару</text>
<text x="665" y="646.25" font-size="11.5" fill="#3d4d66" font-weight="400">(datacenter_id, worker_id); раскладка по</text>
<text x="665" y="663.5" font-size="11.5" fill="#3d4d66" font-weight="400">умолчанию даёт 32 × 32 = 1024 узла.</text>
<rect x="650.0" y="694.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="694.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="718" font-size="13.0" fill="#0f1e33" font-weight="700">Шкала времени жизни</text>
<rect x="670.0" y="748.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="748.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="744.0" x2="678.8" y2="763.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="739" font-size="10.0" fill="#b45309" font-weight="600">эпоха 2024-01-01</text>
<text x="920" y="739" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">предел 2093</text>
<text x="670" y="784" font-size="10.5" fill="#3d4d66" font-weight="400">Старт: epoch = 2024-01-01 UTC</text>
<text x="670" y="800" font-size="10.5" fill="#3d4d66" font-weight="400">Предел: 2^41 − 1 мс ≈ 69,7 лет</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">Исчерпание выбрасывает</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">TimestampOverflowException</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">Более поздняя эпоха возвращает полный срок</text>
<text x="670" y="864" font-size="10.5" fill="#3d4d66" font-weight="400">службы.</text>
<text x="670" y="892" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">К 2026 израсходовано ~3%</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Вызов id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Читаем текущую миллисекунду — это временная база для</text>
<text x="178" y="265" font-size="10.5" fill="#b45309" font-weight="400">данного ID.</text>
<path d="M350.0,265.0 L350.0,289.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="281.0" font-size="10.5" fill="#6b7c96" font-weight="600">Нет</text>
<polygon points="350,289.0 500.0,323.0 350,357.0 200.0,323.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="328.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (часы пошли назад)</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">Да → если дрейф укладывается в clock_tolerance_ms,</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">переиспользуем предыдущую миллисекунду; иначе</text>
<text x="178" y="408" font-size="10.5" fill="#b45309" font-weight="400">ClockDriftException и отказ генерировать.</text>
<path d="M350.0,408.0 L350.0,432.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="432.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="461.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="501" font-size="10.5" fill="#b45309" font-weight="400">offset — расстояние в миллисекундах от заданной эпохи.</text>
<path d="M350.0,501.0 L350.0,525.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="517.0" font-size="10.5" fill="#6b7c96" font-weight="600">Нет</text>
<polygon points="350,525.0 500.0,559.0 350,593.0 200.0,559.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="556.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset вне диапазона?</text>
<text x="350" y="572.0" font-size="10.2" fill="#6b7c96" font-weight="400" text-anchor="middle">(меньше 0 или больше предела)</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">Да → часы раньше эпохи дают ClockDriftException; исчерпанная</text>
<text x="178" y="628" font-size="10.5" fill="#b45309" font-weight="400">эпоха — TimestampOverflowException.</text>
<path d="M350.0,628.0 L350.0,652.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="652.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="681.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">Когда последовательность исчерпана (null), ждём следующую</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">миллисекунду, повторяем один раз, затем RuntimeException.</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; собираем ID</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">Состояние двигается только после всех проверок, поэтому</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">сбойный вызов не отравит следующий.</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Возвращаем 64-битный уникальный ID</text>
</svg>
