<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Дизайн возможностей</title>
<desc>Три области возможностей, девять ключевых функций</desc>
<defs>
</defs>
<rect width="980" height="640" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Дизайн возможностей</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Три области возможностей, девять ключевых функций</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="476.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="167.3" height="28.0" rx="14.0" fill="#2563eb"/><text x="139.628125" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Базовые возможности</text>
<rect x="56.0" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Генерация уникальных ID</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64-битные, k-ordered, глобально</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">уникальные; ~500 тыс. ID/с на</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">процесс без центрального</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">координатора и обращений к БД.</text>
<rect x="56.0" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="322.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">Гибкое распределение битов</text>
<rect x="71.0" y="354.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="367" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">Ширина полей timestamp, датацентра,</text>
<text x="71.0" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">воркера и последовательности</text>
<text x="71.0" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">настраивается; раскладка 5+5+12 по</text>
<text x="71.0" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">умолчанию даёт 1024 узла.</text>
<rect x="56.0" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="460.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Разбор ID</text>
<rect x="71.0" y="492.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="505" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Раскладывает любой ID на timestamp,</text>
<text x="71.0" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">датацентр, воркер и</text>
<text x="71.0" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">последовательность — полезно для</text>
<text x="71.0" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">отладки и шардирования.</text>
<rect x="346.7" y="120.0" width="286.7" height="476.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="145.2" height="28.0" rx="14.0" fill="#0e7490"/><text x="435.2697916666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Точки расширения</text>
<rect x="362.7" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="10.6" fill="#0f1e33" font-weight="700">Сменные стратегии последовательности</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">SequenceResolver — это интерфейс;</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">две реализации идут в комплекте, а</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">общая последовательность на Redis</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">пишется в несколько строк.</text>
<rect x="362.7" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="322.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">Защита от дрейфа часов</text>
<rect x="377.7" y="354.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="367" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">Настраиваемое окно допуска</text>
<text x="377.6666666666667" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">сглаживает дрожание NTP; выход за</text>
<text x="377.6666666666667" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">него — исключение вместо риска</text>
<text x="377.6666666666667" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">дубликатов ID.</text>
<rect x="362.7" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="460.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Адаптеры фреймворков</text>
<rect x="377.7" y="492.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="505" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Laravel, Webman, ThinkPHP и Hyperf</text>
<text x="377.6666666666667" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">работают из коробки — с</text>
<text x="377.6666666666667" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">автообнаружением и интеграцией с</text>
<text x="377.6666666666667" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">контейнером.</text>
<rect x="653.3" y="120.0" width="286.7" height="476.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="94.2" height="28.0" rx="14.0" fill="#6d28d9"/><text x="716.4083333333334" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Инженерия</text>
<rect x="669.3" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="12.8" fill="#0f1e33" font-weight="700">Строгая валидация конфигурации</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Массивы, файлы конфигурации и</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">переменные окружения попадают в</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">одну фабрику с валидацией,</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">отсекающую невозможные комбинации.</text>
<rect x="669.3" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="322.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">Семантические исключения</text>
<rect x="684.3" y="354.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="367" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">Пять типов исключений; каждое несёт</text>
<text x="684.3333333333334" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">само значение и его лимит, так что</text>
<text x="684.3333333333334" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">сообщение сразу указывает на ошибку</text>
<text x="684.3333333333334" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">в конфигурации.</text>
<rect x="669.3" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="460.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Качество и поставка</text>
<rect x="684.3" y="492.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="505" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Полный набор тестов PHPUnit, матрица</text>
<text x="684.3333333333334" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">CI на PHP 8.0–8.4 и автоматическое</text>
<text x="684.3333333333334" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">версионирование при каждом пуше в</text>
<text x="684.3333333333334" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">main.</text>
<text x="40" y="632" font-size="11.5" fill="#6b7c96" font-weight="400">Требования: PHP &gt;= 8.0 (CI: 8.0 – 8.4) · 64-битная система · один экземпляр на процесс или корутину, состояние последовательности не разделяется</text>
</svg>
