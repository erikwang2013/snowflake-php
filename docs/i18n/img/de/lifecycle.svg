<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 910" width="980" height="910" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>ID-Lebenszyklus</title>
<desc>Ein id()-Aufruf: der komplette Weg, der berührte Zustand und die beachteten Limits</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="910" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">ID-Lebenszyklus</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Ein id()-Aufruf: der komplette Weg, der berührte Zustand und die beachteten Limits</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="172.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="172.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">ID-Layout (standardmäßig 64 Bit)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">Zeitstempel 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">Sequenz 12</text>
<text x="666" y="208" font-size="10.5" fill="#6b7c96" font-weight="400">Vorzeichenbit 1 (immer 0); Zeitstempel = Millisekunden seit der Epoche</text>
<text x="666" y="224" font-size="10.5" fill="#6b7c96" font-weight="400">Datacenter 5 Bit × Worker 5 Bit = 32 × 32 = 1024 Knoten</text>
<text x="666" y="240" font-size="10.5" fill="#6b7c96" font-weight="400">Sequenz 12 Bit = 4096 IDs je Millisekunde (Standard-Layout)</text>
<rect x="650.0" y="310.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="310.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="334" font-size="9.9" fill="#0f1e33" font-weight="700">Instanzzustand (bleibt über Aufrufe hinweg erhalten)</text>
<text x="665" y="356.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — die Millisekunde der</text>
<text x="665" y="373.25" font-size="11.5" fill="#3d4d66" font-weight="400">vorherigen ID, für Drift- und</text>
<text x="665" y="390.5" font-size="11.5" fill="#3d4d66" font-weight="400">Erschöpfungsprüfungen</text>
<text x="665" y="407.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — der Sequenz-Cursor für</text>
<text x="665" y="425.0" font-size="11.5" fill="#3d4d66" font-weight="400">die aktuelle Millisekunde (seq / lastTs)</text>
<text x="665" y="442.25" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — Knoten-Bits und Startzeit,</text>
<text x="665" y="459.5" font-size="11.5" fill="#3d4d66" font-weight="400">nach der Konstruktion nur lesbar</text>
<text x="666" y="484" font-size="7.5" fill="#dc2626" font-weight="600">Hinweis: Eine Instanz darf nie über Prozesse oder Coroutinen hinweg geteilt werden</text>
<rect x="650.0" y="514.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="514.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="538" font-size="13.0" fill="#0f1e33" font-weight="700">Kapazität &amp; Durchsatz</text>
<text x="665" y="560.0" font-size="11.5" fill="#3d4d66" font-weight="400">Höchstens 2^12 = 4096 IDs je Millisekunde;</text>
<text x="665" y="577.25" font-size="11.5" fill="#3d4d66" font-weight="400">darüber hinaus wird auf die nächste</text>
<text x="665" y="594.5" font-size="11.5" fill="#3d4d66" font-weight="400">Millisekunde gewartet.</text>
<text x="665" y="611.75" font-size="11.5" fill="#3d4d66" font-weight="400">Rund 500k IDs pro Sekunde in einem</text>
<text x="665" y="629.0" font-size="11.5" fill="#3d4d66" font-weight="400">einzelnen Prozess.</text>
<text x="665" y="646.25" font-size="11.5" fill="#3d4d66" font-weight="400">Knoten beanspruchen ein eindeutiges Paar</text>
<text x="665" y="663.5" font-size="11.5" fill="#3d4d66" font-weight="400">(datacenter_id, worker_id); das</text>
<text x="665" y="680.75" font-size="11.5" fill="#3d4d66" font-weight="400">Standard-Layout erlaubt 32 × 32 = 1024</text>
<text x="665" y="698.0" font-size="11.5" fill="#3d4d66" font-weight="400">Knoten.</text>
<rect x="650.0" y="694.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="694.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="718" font-size="13.0" fill="#0f1e33" font-weight="700">Zeitachse der Lebensdauer</text>
<rect x="670.0" y="748.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="748.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="744.0" x2="678.8" y2="763.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="739" font-size="10.0" fill="#b45309" font-weight="600">Epoche 2024-01-01</text>
<text x="920" y="739" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">Limit 2093</text>
<text x="670" y="784" font-size="10.5" fill="#3d4d66" font-weight="400">Start: Epoche = 2024-01-01 UTC</text>
<text x="670" y="800" font-size="10.5" fill="#3d4d66" font-weight="400">Limit: 2^41 − 1 ms ≈ 69,7 Jahre</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">Erschöpfung wirft TimestampOverflowException</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">Eine neuere Epoche setzt die volle Lebensdauer</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">zurück.</text>
<text x="670" y="876" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">Bis 2026 ca. 3 % verbraucht</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">id() / nextId() aufrufen</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Die aktuelle Millisekunde lesen; sie ist die Zeitbasis für diese ID.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">Nein</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (Uhr lief rückwärts)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">Ja → liegt die Drift innerhalb von clock_tolerance_ms, wird die</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">vorherige Millisekunde wiederverwendet; sonst ClockDriftException</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">und keine Generierung.</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset ist der Abstand in Millisekunden zur konfigurierten Epoche.</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">Nein</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset außerhalb des Bereichs?</text>
<text x="350" y="556.0" font-size="10.5" fill="#6b7c96" font-weight="400" text-anchor="middle">(unter 0 oder über dem Limit)</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">Ja → eine Uhr vor der Epoche wirft ClockDriftException; eine</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">erschöpfte Epoche wirft TimestampOverflowException.</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">Ist die Sequenz erschöpft (null), wird auf die nächste Millisekunde</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">gewartet und einmal wiederholt, danach schlägt der Aufruf mit</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">einer RuntimeException fehl.</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; ID zusammensetzen</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">Der Zustand rückt erst vor, wenn jede Prüfung bestanden ist — ein</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">fehlgeschlagener Aufruf kann den nächsten nicht vergiften.</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Eindeutige 64-Bit-ID zurückgeben</text>
</svg>
