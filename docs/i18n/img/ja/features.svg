<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>機能設計</title>
<desc>3 つの能力領域、9 つのコア機能</desc>
<defs>
</defs>
<rect width="980" height="820" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">機能設計</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">3 つの能力領域、9 つのコア機能</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="80.5" height="28.0" rx="14.0" fill="#2563eb"/><text x="96.25" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">コア機能</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">ユニーク ID 生成</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64 ビット、k-ordered、グローバルにユ</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">ニーク。中央コーディネータも DB 往復も</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">不要で、1 プロセスあたり毎秒 100 万</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">ID 超。</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">柔軟なビット割り当て</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">タイムスタンプ・データセンター・ワーカ</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">ー・シーケンスの幅をすべて設定可能。デ</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">フォルトの 5+5+12 構成で 1024 ノード</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">。タイムスタンプから借りたビットは寿命</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">を縮め、Snowflake::lifespanMs() で確認で</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">きます。</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">ID パース</text>
<rect x="71.0" y="604.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">生成した ID をタイムスタンプ・データセ</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">ンター・ワーカー・シーケンスに分解。デ</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">バッグやシャーディングに有用。</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="106.8" height="28.0" rx="14.0" fill="#0e7490"/><text x="416.0416666666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">拡張ポイント</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">差し替え可能なシーケンス戦略</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">シーケンスリゾルバはインターフェース。</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">順次・ランダム・Redis の各実装を標準で</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">同梱し、それ以外も数行で実装できます。</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">クロックドリフト保護</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">設定可能な許容幅が NTP の揺らぎを吸収</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">。超えた場合は clock_drift_strategy が判</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">断し、&#x27;wait&#x27; は追いつくまでスピン、</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">&#x27;throw&#x27; は生成を拒否します。</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">フレームワークアダプタ</text>
<rect x="377.7" y="604.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Laravel・Webman・ThinkPHP・Hyperf の</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">アダプタを同梱し、PSR-11 ファクトリで</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">他のコンテナにも対応。コンテナを使わな</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">い素の PHP も可能です。</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="133.0" height="28.0" rx="14.0" fill="#6d28d9"/><text x="735.8333333333334" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">エンジニアリング</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">厳格な設定検証</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">設定配列・設定ファイル・環境変数はすべ</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">て 1 つの検証済みファクトリに集約し、</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">成立しない組み合わせを拒否。</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">意味のある例外</text>
<rect x="684.3" y="410.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">5 種類の例外がそれぞれ問題の値と上限を</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">保持し、メッセージが設定ミスを直接指し</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">示します。</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">品質とデリバリ</text>
<rect x="684.3" y="604.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">充実した PHPUnit スイート、CI の PHP</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">8.0〜8.5、src/ に対する PHPStan レベ</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">ル 8、main への push ごとの自動バージ</text>
<text x="684.3333333333334" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">ョニング。</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">動作環境：PHP &gt;= 8.0 (CI は 8.0〜8.5) · 64 ビット環境 · プロセスまたはコルーチンごとに 1 インスタンス、シーケンス状態は共有されません</text>
</svg>
