<text x="71.0" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">생성된 ID를 타임스탬프, 데이터센터, 워</text>
<text x="71.0" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">커, 시퀀스로 분해합니다. 디버깅과 샤딩</text>
<text x="71.0" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">에 유용합니다.</text>
