<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">시퀀스 리졸버는 인터페이스이며 두 가지</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">구현이 기본 제공됩니다. Redis 기반 공유</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">시퀀스도 몇 줄이면 됩니다.</text>
<rect x="362.7" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="322.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">시계 드리프트 방어</text>
<rect x="377.7" y="354.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="367" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">설정 가능한 허용 범위가 NTP 지터를 흡</text>
<text x="377.6666666666667" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">수하고, 그를 넘으면 중복 ID를 감수하는</text>
<text x="377.6666666666667" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">대신 예외를 던집니다.</text>
<rect x="362.7" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="460.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">프레임워크 어댑터</text>
