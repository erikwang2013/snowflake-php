<text x="414.2214166666667" y="505" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Laravel, Webman, ThinkPHP, Hyperf를</text>
<text x="377.6666666666667" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">자동 발견과 컨테이너 통합과 함께 바로</text>
<text x="377.6666666666667" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">사용할 수 있습니다.</text>
