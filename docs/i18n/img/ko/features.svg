<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64비트, k-정렬, 전역 고유. 중앙 조정자</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">나 DB 왕복 없이 프로세스당 초당 약 50</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">만 개를 생성합니다.</text>
<rect x="56.0" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="322.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">유연한 비트 할당</text>
<rect x="71.0" y="354.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="367" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">타임스탬프, 데이터센터, 워커, 시퀀스 비</text>
<text x="71.0" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">트 폭을 모두 설정할 수 있으며 기본</text>
<text x="71.0" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">5+5+12 배치는 1024개 노드를 지원합니</text>
<text x="71.0" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">다.</text>
<rect x="56.0" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="460.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
