<rect x="362.7" y="136.0" width="87.5" height="28.0" rx="14.0" fill="#0e7490"/><text x="406.3947916666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">확장 지점</text>
<rect x="362.7" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
