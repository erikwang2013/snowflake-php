<text x="71.0" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">dan sequence semuanya dapat</text>
<text x="71.0" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">dikonfigurasi; tata letak default 5+5+12</text>
<text x="71.0" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">mendukung 1024 node.</text>
