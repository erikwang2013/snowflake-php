<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Adapter framework</text>
<rect x="377.7" y="604.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Adapter Laravel, Webman, ThinkPHP,</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">dan Hyperf sudah tersedia bawaan, dan</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">factory PSR-11 mencakup container</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">lain — atau lewati container sepenuhnya</text>
<text x="377.6666666666667" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">dengan PHP murni.</text>
