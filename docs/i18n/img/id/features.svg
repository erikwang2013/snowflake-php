<text x="377.6666666666667" y="208" font-size="11.5" fill="#0f1e33" font-weight="700">Strategi sequence yang dapat dipasang</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Sequence resolver adalah sebuah</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">interface; implementasi sekuensial,</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">acak, dan berbasis Redis sudah</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">tersedia bawaan, dan strategi lain hanya</text>
<text x="377.6666666666667" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">berjarak beberapa baris.</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Perlindungan clock drift</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Jendela toleransi yang dapat</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">dikonfigurasi menyerap jitter NTP. Di</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">luar itu, clock_drift_strategy</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">menentukan: &#x27;wait&#x27; berputar sampai</text>
<text x="377.6666666666667" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">clock menyusul, &#x27;throw&#x27; menolak</text>
<text x="377.6666666666667" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">membuat ID.</text>
