<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64-bit, k-ordered, unik secara global;</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">sekitar 500 ribu ID per detik per</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">proses tanpa koordinator pusat dan</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">tanpa round-trip database.</text>
<rect x="56.0" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
