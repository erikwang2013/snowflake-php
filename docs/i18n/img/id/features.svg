<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Pembuatan ID unik</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64-bit, k-ordered, unik secara global;</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">jauh lebih dari satu juta ID per detik</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">per proses, tanpa koordinator pusat</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">dan tanpa round-trip database.</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Alokasi bit fleksibel</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Lebar timestamp, datacenter, worker,</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">dan sequence semuanya dapat</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">dikonfigurasi; tata letak default 5+5+12</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">mendukung 1024 node. Bit yang</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">dipinjam dari timestamp memperpendek</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">masa pakai; Snowflake::lifespanMs()</text>
<text x="71.0" y="547.5" font-size="11.5" fill="#3d4d66" font-weight="400">melaporkannya.</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Parsing ID</text>
<rect x="71.0" y="604.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Uraikan ID yang dihasilkan kembali</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">menjadi bagian timestamp, datacenter,</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">worker, dan sequence — berguna untuk</text>
<text x="71.0" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">debugging dan sharding.</text>
