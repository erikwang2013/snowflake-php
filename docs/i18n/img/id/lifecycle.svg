<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 910" width="980" height="910" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Siklus Hidup ID</title>
<desc>Satu panggilan id(): jalur lengkapnya, state yang disentuh, dan batas yang dipatuhi</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="910" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Siklus Hidup ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Satu panggilan id(): jalur lengkapnya, state yang disentuh, dan batas yang dipatuhi</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="172.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="172.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">Tata letak ID (default 64 bit)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">sequence 12</text>
<text x="666" y="208" font-size="10.5" fill="#6b7c96" font-weight="400">Bit tanda 1 (selalu 0); timestamp = milidetik sejak epoch</text>
<text x="666" y="224" font-size="10.5" fill="#6b7c96" font-weight="400">Datacenter 5 bit × worker 5 bit = 32 × 32 = 1024 node</text>
<text x="666" y="240" font-size="10.5" fill="#6b7c96" font-weight="400">Sequence 12 bit = 4096 ID per milidetik (tata letak default)</text>
<rect x="650.0" y="310.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="310.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="334" font-size="11.2" fill="#0f1e33" font-weight="700">State instance (dipertahankan antar panggilan)</text>
<text x="665" y="356.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — milidetik ID sebelumnya,</text>
<text x="665" y="373.25" font-size="11.5" fill="#3d4d66" font-weight="400">dipakai untuk cek drift dan kehabisan</text>
<text x="665" y="390.5" font-size="11.5" fill="#3d4d66" font-weight="400">kapasitas</text>
<text x="665" y="407.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — kursor sequence untuk</text>
<text x="665" y="425.0" font-size="11.5" fill="#3d4d66" font-weight="400">milidetik saat ini (seq / lastTs)</text>
<text x="665" y="442.25" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — bit node dan waktu mulai,</text>
<text x="665" y="459.5" font-size="11.5" fill="#3d4d66" font-weight="400">read-only setelah konstruksi</text>
<text x="666" y="484" font-size="7.5" fill="#dc2626" font-weight="600">Catatan: satu instance tidak boleh dibagi antar proses atau coroutine</text>
<rect x="650.0" y="514.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="514.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="538" font-size="13.0" fill="#0f1e33" font-weight="700">Kapasitas &amp; throughput</text>
<text x="665" y="560.0" font-size="11.5" fill="#3d4d66" font-weight="400">Maksimal 2^12 = 4096 ID per milidetik; di</text>
<text x="665" y="577.25" font-size="11.5" fill="#3d4d66" font-weight="400">luar itu akan berputar ke milidetik</text>
<text x="665" y="594.5" font-size="11.5" fill="#3d4d66" font-weight="400">berikutnya.</text>
<text x="665" y="611.75" font-size="11.5" fill="#3d4d66" font-weight="400">Sekitar 500 ribu ID per detik dalam satu</text>
<text x="665" y="629.0" font-size="11.5" fill="#3d4d66" font-weight="400">proses.</text>
<text x="665" y="646.25" font-size="11.5" fill="#3d4d66" font-weight="400">Setiap node memakai pasangan (datacenter_id,</text>
<text x="665" y="663.5" font-size="11.5" fill="#3d4d66" font-weight="400">worker_id) yang unik; tata letak default</text>
<text x="665" y="680.75" font-size="11.5" fill="#3d4d66" font-weight="400">mendukung 32 × 32 = 1024 node.</text>
<rect x="650.0" y="694.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="694.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="718" font-size="13.0" fill="#0f1e33" font-weight="700">Linimasa masa pakai</text>
<rect x="670.0" y="748.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="748.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="744.0" x2="678.8" y2="763.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="739" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="739" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">batas 2093</text>
<text x="670" y="784" font-size="10.5" fill="#3d4d66" font-weight="400">Mulai: epoch = 2024-01-01 UTC</text>
<text x="670" y="800" font-size="10.5" fill="#3d4d66" font-weight="400">Batas: 2^41 − 1 ms ≈ 69,7 tahun</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">Kehabisan kapasitas melempar</text>
<text x="670" y="832" font-size="10.5" fill="#3d4d66" font-weight="400">TimestampOverflowException</text>
<text x="670" y="848" font-size="10.5" fill="#3d4d66" font-weight="400">Epoch yang lebih baru mengulang masa pakai</text>
<text x="670" y="864" font-size="10.5" fill="#3d4d66" font-weight="400">penuh.</text>
<text x="670" y="892" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">Sekitar 3% terpakai pada 2026</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Panggil id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Baca milidetik saat ini; ini basis waktu untuk ID tersebut.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">Tidak</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (clock mundur)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">Ya → jika drift masih dalam clock_tolerance_ms, pakai ulang</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">milidetik sebelumnya; jika tidak, lempar ClockDriftException dan</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">menolak membuat ID.</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset adalah jarak dalam milidetik dari epoch yang dikonfigurasi.</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">Tidak</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">Offset di luar rentang?</text>
<text x="350" y="556.0" font-size="10.5" fill="#6b7c96" font-weight="400" text-anchor="middle">(di bawah 0 atau di atas batas)</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">Ya → clock sebelum epoch melempar ClockDriftException; epoch</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">yang sudah habis melempar TimestampOverflowException.</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">Saat sequence habis (null), ia berputar ke milidetik berikutnya dan</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">mencoba sekali lagi, lalu gagal dengan RuntimeException.</text>
<path d="M350.0,721.0 L350.0,745.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="745.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="774.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; rakit ID</text>
<text x="178" y="814" font-size="10.5" fill="#b45309" font-weight="400">State hanya maju setelah semua guard terlewati, jadi panggilan</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">yang gagal tidak merusak panggilan berikutnya.</text>
<path d="M350.0,830.0 L350.0,854.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="854.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="877.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Kembalikan ID unik 64-bit</text>
</svg>
