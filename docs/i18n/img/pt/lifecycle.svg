<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 924" width="980" height="924" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Ciclo de Vida do ID</title>
<desc>Uma chamada id(): o caminho completo, o estado que ela toca e os limites que respeita</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="924" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Ciclo de Vida do ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Uma chamada id(): o caminho completo, o estado que ela toca e os limites que respeita</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="13.0" fill="#0f1e33" font-weight="700">Layout do ID (64 bits por padrão)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="897.65625" y="178" font-size="7.5" fill="#fff" font-weight="600" text-anchor="middle">sequência 12</text>
<text x="666" y="208" font-size="9.5" fill="#6b7c96" font-weight="400">Bit de sinal 1 (sempre 0); timestamp =</text>
<text x="666" y="223" font-size="9.5" fill="#6b7c96" font-weight="400">milissegundos desde o epoch</text>
<text x="666" y="238" font-size="9.5" fill="#6b7c96" font-weight="400">Datacenter 5 bits × worker 5 bits = 32 × 32 =</text>
<text x="666" y="253" font-size="9.5" fill="#6b7c96" font-weight="400">1024 nós</text>
<text x="666" y="268" font-size="9.5" fill="#6b7c96" font-weight="400">Sequência 12 bits = 4096 IDs por milissegundo</text>
<text x="666" y="283" font-size="9.5" fill="#6b7c96" font-weight="400">(layout padrão)</text>
<rect x="650.0" y="324.0" width="290.0" height="186.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="186.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="11.2" fill="#0f1e33" font-weight="700">Estado da instância (mantido entre chamadas)</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — o milissegundo do ID</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">anterior, usado nas checagens de deriva e</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">esgotamento</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — o cursor de sequência do</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">milissegundo atual (seq / lastTs)</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — bits do nó e tempo de</text>
<text x="665" y="473.5" font-size="11.5" fill="#3d4d66" font-weight="400">início, somente leitura após a construção</text>
<text x="666" y="498" font-size="7.5" fill="#dc2626" font-weight="600">Nota: uma instância nunca deve ser compartilhada entre processos ou corrotinas</text>
<rect x="650.0" y="528.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="528.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="552" font-size="13.0" fill="#0f1e33" font-weight="700">Capacidade e vazão</text>
<text x="665" y="574.0" font-size="11.5" fill="#3d4d66" font-weight="400">No máximo 2^12 = 4096 IDs por</text>
<text x="665" y="591.25" font-size="11.5" fill="#3d4d66" font-weight="400">milissegundo; além disso, avança para o</text>
<text x="665" y="608.5" font-size="11.5" fill="#3d4d66" font-weight="400">próximo milissegundo.</text>
<text x="665" y="625.75" font-size="11.5" fill="#3d4d66" font-weight="400">Cerca de 500 mil IDs por segundo em um</text>
<text x="665" y="643.0" font-size="11.5" fill="#3d4d66" font-weight="400">único processo.</text>
<text x="665" y="660.25" font-size="11.5" fill="#3d4d66" font-weight="400">Nós reivindicam um par único (datacenter_id,</text>
<text x="665" y="677.5" font-size="11.5" fill="#3d4d66" font-weight="400">worker_id); o layout padrão permite 32 × 32</text>
<text x="665" y="694.75" font-size="11.5" fill="#3d4d66" font-weight="400">= 1024 nós.</text>
<rect x="650.0" y="708.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="708.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="732" font-size="13.0" fill="#0f1e33" font-weight="700">Linha do tempo de vida</text>
<rect x="670.0" y="762.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="762.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="758.0" x2="678.8" y2="777.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="753" font-size="10.0" fill="#b45309" font-weight="600">epoch 2024-01-01</text>
<text x="920" y="753" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">limite 2093</text>
<text x="670" y="798" font-size="10.5" fill="#3d4d66" font-weight="400">Início: epoch = 2024-01-01 UTC</text>
<text x="670" y="814" font-size="10.5" fill="#3d4d66" font-weight="400">Limite: 2^41 − 1 ms ≈ 69,7 anos</text>
<text x="670" y="830" font-size="10.5" fill="#3d4d66" font-weight="400">O esgotamento lança</text>
<text x="670" y="846" font-size="10.5" fill="#3d4d66" font-weight="400">TimestampOverflowException</text>
<text x="670" y="862" font-size="10.5" fill="#3d4d66" font-weight="400">Um epoch mais recente reinicia todo o tempo</text>
<text x="670" y="878" font-size="10.5" fill="#3d4d66" font-weight="400">de vida.</text>
<text x="670" y="906" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">Cerca de 3% consumidos até 2026</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Chama id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Lê o milissegundo atual; é a base de tempo deste ID.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">Não</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="11.1" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (relógio andou para trás)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">Sim → se a deriva estiver dentro de clock_tolerance_ms, reutiliza</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">o milissegundo anterior; caso contrário lança ClockDriftException</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">e recusa a geração.</text>
<path d="M350.0,392.0 L350.0,416.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="416.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="445.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="485" font-size="10.5" fill="#b45309" font-weight="400">offset é a distância em milissegundos desde o epoch configurado.</text>
<path d="M350.0,485.0 L350.0,509.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="501.0" font-size="10.5" fill="#6b7c96" font-weight="600">Não</text>
<polygon points="350,509.0 500.0,543.0 350,577.0 200.0,543.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="540.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">Offset fora da faixa?</text>
<text x="350" y="556.0" font-size="10.0" fill="#6b7c96" font-weight="400" text-anchor="middle">(abaixo de 0 ou acima do limite)</text>
<text x="178" y="596" font-size="10.5" fill="#b45309" font-weight="400">Sim → um relógio antes do epoch lança ClockDriftException; um</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">epoch esgotado lança TimestampOverflowException.</text>
<path d="M350.0,612.0 L350.0,636.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="636.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="665.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="705" font-size="10.5" fill="#b45309" font-weight="400">Quando a sequência se esgota (null), avança para o próximo</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">milissegundo e tenta mais uma vez; depois falha com</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">RuntimeException.</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; monta o ID</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">O estado só avança depois que todas as guardas passam, então</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">uma chamada falha não contamina a próxima.</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Retorna um ID único de 64 bits</text>
</svg>
