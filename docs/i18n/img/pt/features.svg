<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Design de Recursos</title>
<desc>Três domínios de capacidade, nove recursos centrais</desc>
<defs>
</defs>
<rect width="980" height="820" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Design de Recursos</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Três domínios de capacidade, nove recursos centrais</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="652.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="160.0" height="28.0" rx="14.0" fill="#2563eb"/><text x="136.01875" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Capacidades centrais</text>
<rect x="56.0" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Geração de IDs únicos</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64 bits, k-ordenado, globalmente único;</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">bem mais de um milhão de IDs por</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">segundo por processo, sem</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">coordenador central e sem ida ao</text>
<text x="71.0" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">banco.</text>
<rect x="56.0" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="378.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Alocação flexível de bits</text>
<rect x="71.0" y="410.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="423" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">As larguras de timestamp, datacenter,</text>
<text x="71.0" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">worker e sequência são configuráveis;</text>
<text x="71.0" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">o layout padrão 5+5+12 suporta 1024</text>
<text x="71.0" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">nós. Bits tomados do timestamp</text>
<text x="71.0" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">encurtam o tempo de vida;</text>
<text x="71.0" y="530.25" font-size="11.5" fill="#3d4d66" font-weight="400">Snowflake::lifespanMs() informa quanto.</text>
<rect x="56.0" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="572.0" width="4.0" height="180.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Parsing de ID</text>
<rect x="71.0" y="604.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="617" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Decomponha qualquer ID gerado de</text>
<text x="71.0" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">volta em timestamp, datacenter, worker</text>
<text x="71.0" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">e sequência — útil para depuração e</text>
<text x="71.0" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">sharding.</text>
<rect x="346.7" y="120.0" width="286.7" height="652.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="148.9" height="28.0" rx="14.0" fill="#0e7490"/><text x="437.1072916666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Pontos de extensão</text>
<rect x="362.7" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="12.7" fill="#0f1e33" font-weight="700">Estratégias de sequência plugáveis</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">O resolvedor de sequência é uma</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">interface; implementações sequencial,</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">aleatória e com Redis vêm embutidas,</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">e qualquer outra está a poucas linhas</text>
<text x="377.6666666666667" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">de distância.</text>
<rect x="362.7" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="378.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="402" font-size="12.9" fill="#0f1e33" font-weight="700">Proteção contra deriva de relógio</text>
<rect x="377.7" y="410.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="423" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Uma janela de tolerância configurável</text>
<text x="377.6666666666667" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">absorve o jitter do NTP. Além dela,</text>
<text x="377.6666666666667" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">clock_drift_strategy decide: &#x27;wait&#x27;</text>
<text x="377.6666666666667" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">aguarda o relógio alcançar, &#x27;throw&#x27;</text>
<text x="377.6666666666667" y="513.0" font-size="11.5" fill="#3d4d66" font-weight="400">recusa a geração.</text>
<rect x="362.7" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="572.0" width="4.0" height="180.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Adaptadores de framework</text>
<rect x="377.7" y="604.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="617" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Adaptadores Laravel, Webman,</text>
<text x="377.6666666666667" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">ThinkPHP e Hyperf vêm embutidos, e a</text>
<text x="377.6666666666667" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">factory PSR-11 cobre qualquer outro</text>
<text x="377.6666666666667" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">container — ou dispense containers com</text>
<text x="377.6666666666667" y="707.0" font-size="11.5" fill="#3d4d66" font-weight="400">PHP puro.</text>
<rect x="653.3" y="120.0" width="286.7" height="652.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="96.0" height="28.0" rx="14.0" fill="#6d28d9"/><text x="717.3270833333333" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Engenharia</text>
<rect x="669.3" y="184.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Validação estrita de config</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Arrays de config, arquivos de config e</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">variáveis de ambiente chegam todos a</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">uma única factory validada que rejeita</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">combinações impossíveis.</text>
<rect x="669.3" y="378.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="378.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="402" font-size="13.0" fill="#0f1e33" font-weight="700">Exceções semânticas</text>
<rect x="684.3" y="410.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="423" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="444.0" font-size="11.5" fill="#3d4d66" font-weight="400">Cinco tipos de exceção, cada um</text>
<text x="684.3333333333334" y="461.25" font-size="11.5" fill="#3d4d66" font-weight="400">carregando o valor inválido e seu</text>
<text x="684.3333333333334" y="478.5" font-size="11.5" fill="#3d4d66" font-weight="400">limite, para que a mensagem aponte</text>
<text x="684.3333333333334" y="495.75" font-size="11.5" fill="#3d4d66" font-weight="400">direto para a configuração errada.</text>
<rect x="669.3" y="572.0" width="254.7" height="180.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="572.0" width="4.0" height="180.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="596" font-size="13.0" fill="#0f1e33" font-weight="700">Qualidade e entrega</text>
<rect x="684.3" y="604.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="617" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="638.0" font-size="11.5" fill="#3d4d66" font-weight="400">Suíte PHPUnit completa, PHP 8.0–8.5</text>
<text x="684.3333333333334" y="655.25" font-size="11.5" fill="#3d4d66" font-weight="400">na CI, PHPStan nível 8 em src/, e</text>
<text x="684.3333333333334" y="672.5" font-size="11.5" fill="#3d4d66" font-weight="400">versionamento automático a cada push</text>
<text x="684.3333333333334" y="689.75" font-size="11.5" fill="#3d4d66" font-weight="400">na main.</text>
<text x="40" y="796" font-size="11.5" fill="#6b7c96" font-weight="400">Runtime: PHP &gt;= 8.0 (CI cobre 8.0 – 8.5) · sistema 64 bits · uma instância por processo ou corrotina, o estado da sequência nunca é compartilhado</text>
</svg>
