<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Design de Recursos</title>
<desc>Três domínios de capacidade, nove recursos centrais</desc>
<defs>
</defs>
<rect width="980" height="640" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Design de Recursos</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Três domínios de capacidade, nove recursos centrais</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="40.0" y="120.0" width="286.7" height="476.0" rx="14" fill="#f8fbff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="56.0" y="136.0" width="160.0" height="28.0" rx="14.0" fill="#2563eb"/><text x="136.01875" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Capacidades centrais</text>
<rect x="56.0" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="184.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Geração de IDs únicos</text>
<rect x="71.0" y="216.0" width="87.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="114.721" y="229" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">id() · nextId()</text>
<text x="71.0" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">64 bits, k-ordenado, globalmente único;</text>
<text x="71.0" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">cerca de 500 mil IDs por segundo por</text>
<text x="71.0" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">processo, sem coordenador central e</text>
<text x="71.0" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">sem ida ao banco.</text>
<rect x="56.0" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="322.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">Alocação flexível de bits</text>
<rect x="71.0" y="354.0" width="171.6" height="18.0" rx="9" fill="#f8fbff"/>
<text x="156.781375" y="367" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">worker_bits · datacenter_bits</text>
<text x="71.0" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">As larguras de timestamp, datacenter,</text>
<text x="71.0" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">worker e sequência são configuráveis;</text>
<text x="71.0" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">o layout padrão 5+5+12 suporta 1024</text>
<text x="71.0" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">nós.</text>
<rect x="56.0" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="56.0" y="460.0" width="4.0" height="124.0" rx="2" fill="#2563eb"/>
<text x="71.0" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Parsing de ID</text>
<rect x="71.0" y="492.0" width="115.4" height="18.0" rx="9" fill="#f8fbff"/>
<text x="128.72275" y="505" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">parseId() · parse()</text>
<text x="71.0" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Decomponha qualquer ID gerado de</text>
<text x="71.0" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">volta em timestamp, datacenter, worker</text>
<text x="71.0" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">e sequência — útil para depuração e</text>
<text x="71.0" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">sharding.</text>
<rect x="346.7" y="120.0" width="286.7" height="476.0" rx="14" fill="#f6fdfe" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="362.7" y="136.0" width="148.9" height="28.0" rx="14.0" fill="#0e7490"/><text x="437.1072916666667" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Pontos de extensão</text>
<rect x="362.7" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="184.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="208" font-size="12.7" fill="#0f1e33" font-weight="700">Estratégias de sequência plugáveis</text>
<rect x="377.7" y="216.0" width="109.2" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="432.2472916666667" y="229" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">SequenceResolver</text>
<text x="377.6666666666667" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">O resolvedor de sequência é uma</text>
<text x="377.6666666666667" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">interface; duas implementações vêm</text>
<text x="377.6666666666667" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">embutidas, e uma sequência</text>
<text x="377.6666666666667" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">compartilhada via Redis está a poucas</text>
<text x="377.6666666666667" y="319.0" font-size="11.5" fill="#3d4d66" font-weight="400">linhas de distância.</text>
<rect x="362.7" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="322.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="346" font-size="12.9" fill="#0f1e33" font-weight="700">Proteção contra deriva de relógio</text>
<rect x="377.7" y="354.0" width="117.9" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="436.6021666666667" y="367" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">clock_tolerance_ms</text>
<text x="377.6666666666667" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">Uma janela de tolerância configurável</text>
<text x="377.6666666666667" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">absorve o jitter do NTP; qualquer coisa</text>
<text x="377.6666666666667" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">além disso lança exceção em vez de</text>
<text x="377.6666666666667" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">arriscar IDs duplicados.</text>
<rect x="362.7" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="362.7" y="460.0" width="4.0" height="124.0" rx="2" fill="#0e7490"/>
<text x="377.6666666666667" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Adaptadores de framework</text>
<rect x="377.7" y="492.0" width="73.1" height="18.0" rx="9" fill="#f6fdfe"/>
<text x="414.2214166666667" y="505" font-size="10.5" fill="#0e7490" font-weight="600" text-anchor="middle">Adapters/*</text>
<text x="377.6666666666667" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Laravel, Webman, ThinkPHP e Hyperf</text>
<text x="377.6666666666667" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">funcionam de imediato, com</text>
<text x="377.6666666666667" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">auto-discovery e integração com o</text>
<text x="377.6666666666667" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">container.</text>
<rect x="653.3" y="120.0" width="286.7" height="476.0" rx="14" fill="#fbf9ff" stroke="#dbe6f5" stroke-width="1.4"/>
<rect x="669.3" y="136.0" width="96.0" height="28.0" rx="14.0" fill="#6d28d9"/><text x="717.3270833333333" y="154.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Engenharia</text>
<rect x="669.3" y="184.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="184.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="208" font-size="13.0" fill="#0f1e33" font-weight="700">Validação estrita de config</text>
<rect x="684.3" y="216.0" width="79.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="723.9199583333334" y="229" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">fromConfig()</text>
<text x="684.3333333333334" y="250.0" font-size="11.5" fill="#3d4d66" font-weight="400">Arrays de config, arquivos de config e</text>
<text x="684.3333333333334" y="267.25" font-size="11.5" fill="#3d4d66" font-weight="400">variáveis de ambiente chegam todos a</text>
<text x="684.3333333333334" y="284.5" font-size="11.5" fill="#3d4d66" font-weight="400">uma única factory validada que rejeita</text>
<text x="684.3333333333334" y="301.75" font-size="11.5" fill="#3d4d66" font-weight="400">combinações impossíveis.</text>
<rect x="669.3" y="322.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="322.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="346" font-size="13.0" fill="#0f1e33" font-weight="700">Exceções semânticas</text>
<rect x="684.3" y="354.0" width="82.5" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="725.5737083333333" y="367" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">Exceptions/*</text>
<text x="684.3333333333334" y="388.0" font-size="11.5" fill="#3d4d66" font-weight="400">Cinco tipos de exceção, cada um</text>
<text x="684.3333333333334" y="405.25" font-size="11.5" fill="#3d4d66" font-weight="400">carregando o valor inválido e seu</text>
<text x="684.3333333333334" y="422.5" font-size="11.5" fill="#3d4d66" font-weight="400">limite, para que a mensagem aponte</text>
<text x="684.3333333333334" y="439.75" font-size="11.5" fill="#3d4d66" font-weight="400">direto para a configuração errada.</text>
<rect x="669.3" y="460.0" width="254.7" height="124.0" rx="12" fill="#ffffff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="669.3" y="460.0" width="4.0" height="124.0" rx="2" fill="#6d28d9"/>
<text x="684.3333333333334" y="484" font-size="13.0" fill="#0f1e33" font-weight="700">Qualidade e entrega</text>
<rect x="684.3" y="492.0" width="126.2" height="18.0" rx="9" fill="#fbf9ff"/>
<text x="747.4583333333334" y="505" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ci.yml · release.yml</text>
<text x="684.3333333333334" y="526.0" font-size="11.5" fill="#3d4d66" font-weight="400">Uma suíte PHPUnit completa, uma</text>
<text x="684.3333333333334" y="543.25" font-size="11.5" fill="#3d4d66" font-weight="400">matriz de CI do PHP 8.0–8.4 e</text>
<text x="684.3333333333334" y="560.5" font-size="11.5" fill="#3d4d66" font-weight="400">versionamento automático a cada push</text>
<text x="684.3333333333334" y="577.75" font-size="11.5" fill="#3d4d66" font-weight="400">na main.</text>
<text x="40" y="632" font-size="11.5" fill="#6b7c96" font-weight="400">Runtime: PHP &gt;= 8.0 (CI cobre 8.0 – 8.4) · sistema 64 bits · uma instância por processo ou corrotina, o estado da sequência nunca é compartilhado</text>
</svg>
