<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 950" width="980" height="950" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', 'Malgun Gothic', Roboto, 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Bangla MN', 'Bangla Sangam MN', 'Noto Sans Bengali', 'Geeza Pro', 'Noto Sans Arabic', Arial, sans-serif">
<title>Ciclo de vida del ID</title>
<desc>Una llamada a id(): el recorrido completo, el estado que toca y los límites que respeta</desc>
<defs>
<marker id="mk-5b8def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#5b8def"/></marker>
</defs>
<rect width="980" height="950" fill="#ffffff"/>
<text x="40" y="54" font-size="27.0" fill="#0f1e33" font-weight="700">Ciclo de vida del ID</text>
<text x="40" y="82" font-size="13.5" fill="#6b7c96" font-weight="400">Una llamada a id(): el recorrido completo, el estado que toca y los límites que respeta</text>
<line x1="40.0" y1="100.0" x2="940.0" y2="100.0" stroke="#e8eefa" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="835.9" y="36.0" width="104.1" height="26.0" rx="13" fill="#eef4ff" stroke="#c3d7ff" stroke-width="1.2"/>
<text x="887.937375" y="53" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">snowflake-php</text>
<rect x="650.0" y="120.0" width="290.0" height="186.0" rx="12" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<rect x="650.0" y="120.0" width="4.0" height="186.0" rx="2" fill="#2563eb"/>
<text x="665" y="144" font-size="12.7" fill="#0f1e33" font-weight="700">Distribución del ID (64 bits por defecto)</text>
<rect x="666.0" y="160.0" width="9.0" height="26.0" rx="4" fill="#475569"/>
<rect x="675.0" y="160.0" width="160.2" height="26.0" rx="0" fill="#2563eb"/>
<text x="755.078125" y="178" font-size="10.0" fill="#fff" font-weight="600" text-anchor="middle">timestamp 41</text>
<rect x="835.2" y="160.0" width="19.5" height="26.0" rx="0" fill="#6d28d9"/>
<rect x="854.7" y="160.0" width="19.5" height="26.0" rx="0" fill="#0e7490"/>
<rect x="874.2" y="160.0" width="46.9" height="26.0" rx="4" fill="#b45309"/>
<text x="666" y="208" font-size="9.5" fill="#6b7c96" font-weight="400">Bit de signo 1 (siempre 0); timestamp =</text>
<text x="666" y="223" font-size="9.5" fill="#6b7c96" font-weight="400">milisegundos desde la época</text>
<text x="666" y="238" font-size="9.5" fill="#6b7c96" font-weight="400">Datacenter 5 bits × worker 5 bits = 32 × 32 =</text>
<text x="666" y="253" font-size="9.5" fill="#6b7c96" font-weight="400">1024 nodos</text>
<text x="666" y="268" font-size="9.5" fill="#6b7c96" font-weight="400">Secuencia 12 bits = 4096 ID por milisegundo</text>
<text x="666" y="283" font-size="9.5" fill="#6b7c96" font-weight="400">(distribución por defecto)</text>
<rect x="650.0" y="324.0" width="290.0" height="204.0" rx="12" fill="#fbf9ff" stroke="#d5c6fa" stroke-width="1.5"/>
<rect x="650.0" y="324.0" width="4.0" height="204.0" rx="2" fill="#6d28d9"/>
<text x="665" y="348" font-size="10.6" fill="#0f1e33" font-weight="700">Estado de la instancia (persiste entre llamadas)</text>
<text x="665" y="370.0" font-size="11.5" fill="#3d4d66" font-weight="400">lastTimestamp — el milisegundo del ID</text>
<text x="665" y="387.25" font-size="11.5" fill="#3d4d66" font-weight="400">anterior; se usa para comprobar deriva y</text>
<text x="665" y="404.5" font-size="11.5" fill="#3d4d66" font-weight="400">agotamiento</text>
<text x="665" y="421.75" font-size="11.5" fill="#3d4d66" font-weight="400">sequenceResolver — el cursor de secuencia</text>
<text x="665" y="439.0" font-size="11.5" fill="#3d4d66" font-weight="400">del milisegundo actual (seq / lastTs)</text>
<text x="665" y="456.25" font-size="11.5" fill="#3d4d66" font-weight="400">fixedBits / epoch — bits de nodo y hora de</text>
<text x="665" y="473.5" font-size="11.5" fill="#3d4d66" font-weight="400">inicio; solo lectura tras construir</text>
<text x="666" y="486.0" font-size="10.5" fill="#dc2626" font-weight="600">Nota: una instancia nunca debe compartirse</text>
<text x="666" y="500.175" font-size="10.5" fill="#dc2626" font-weight="600">entre procesos ni corrutinas</text>
<rect x="650.0" y="546.0" width="290.0" height="162.0" rx="12" fill="#f6fdfe" stroke="#a9dcea" stroke-width="1.5"/>
<rect x="650.0" y="546.0" width="4.0" height="162.0" rx="2" fill="#0e7490"/>
<text x="665" y="570" font-size="13.0" fill="#0f1e33" font-weight="700">Capacidad y rendimiento</text>
<text x="665" y="592.0" font-size="11.5" fill="#3d4d66" font-weight="400">Como máximo 2^12 = 4096 ID por</text>
<text x="665" y="609.25" font-size="11.5" fill="#3d4d66" font-weight="400">milisegundo; más allá avanza al siguiente</text>
<text x="665" y="626.5" font-size="11.5" fill="#3d4d66" font-weight="400">milisegundo.</text>
<text x="665" y="643.75" font-size="11.5" fill="#3d4d66" font-weight="400">Muy por encima del millón de ID por</text>
<text x="665" y="661.0" font-size="11.5" fill="#3d4d66" font-weight="400">segundo en un solo proceso.</text>
<text x="665" y="678.25" font-size="11.5" fill="#3d4d66" font-weight="400">Cada nodo usa un par (datacenter_id,</text>
<text x="665" y="695.5" font-size="11.5" fill="#3d4d66" font-weight="400">worker_id) único; la distribución por defecto</text>
<text x="665" y="712.75" font-size="11.5" fill="#3d4d66" font-weight="400">permite 32 × 32 = 1024 nodos.</text>
<rect x="650.0" y="726.0" width="290.0" height="182.0" rx="12" fill="#fffaf0" stroke="#f7d59b" stroke-width="1.5"/>
<rect x="650.0" y="726.0" width="4.0" height="182.0" rx="2" fill="#b45309"/>
<text x="665" y="750" font-size="13.0" fill="#0f1e33" font-weight="700">Línea de vida útil</text>
<rect x="670.0" y="780.0" width="250.0" height="10.0" rx="5" fill="#dbe3ec"/>
<rect x="670.0" y="780.0" width="8.8" height="10.0" rx="5" fill="#b45309"/>
<line x1="678.8" y1="776.0" x2="678.8" y2="795.0" stroke="#b45309" stroke-width="2" stroke-linecap="butt"/>
<text x="670" y="771" font-size="10.0" fill="#b45309" font-weight="600">época 2024-01-01</text>
<text x="920" y="771" font-size="10.0" fill="#6b7c96" font-weight="600" text-anchor="end">límite 2093</text>
<text x="670" y="816" font-size="10.5" fill="#3d4d66" font-weight="400">Inicio: época = 2024-01-01 UTC</text>
<text x="670" y="830" font-size="10.5" fill="#3d4d66" font-weight="400">Límite: 2^41 − 1 ms ≈ 69,7 años</text>
<text x="670" y="844" font-size="10.5" fill="#3d4d66" font-weight="400">El agotamiento lanza</text>
<text x="670" y="858" font-size="10.5" fill="#3d4d66" font-weight="400">TimestampOverflowException</text>
<text x="670" y="872" font-size="10.5" fill="#3d4d66" font-weight="400">Una época más reciente reinicia toda la vida</text>
<text x="670" y="886" font-size="10.5" fill="#3d4d66" font-weight="400">útil.</text>
<text x="670" y="912" font-size="10.5" fill="#3d4d66" text-anchor="start"><tspan fill="#6b7c96" font-weight="400">Un 3% consumido en 2026</tspan></text>
<rect x="240.0" y="120.0" width="220.0" height="36.0" rx="18.0" fill="#0f766e"/><text x="350.0" y="142.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Llama a id() / nextId()</text>
<path d="M350.0,156.0 L350.0,180.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="180.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="209.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t = microtime(true) × 1000</text>
<text x="178" y="249" font-size="10.5" fill="#b45309" font-weight="400">Lee el milisegundo actual; es la base de tiempo de este ID.</text>
<path d="M350.0,249.0 L350.0,273.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="265.0" font-size="10.5" fill="#6b7c96" font-weight="600">No</text>
<polygon points="350,273.0 500.0,307.0 350,341.0 200.0,307.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="312.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">t &lt; lastTimestamp (el reloj retrocedió)</text>
<text x="178" y="360" font-size="10.5" fill="#b45309" font-weight="400">Sí → si la deriva está dentro de clock_tolerance_ms, reutiliza el</text>
<text x="178" y="376" font-size="10.5" fill="#b45309" font-weight="400">milisegundo anterior. Más allá, clock_drift_strategy decide: &#x27;wait&#x27;</text>
<text x="178" y="392" font-size="10.5" fill="#b45309" font-weight="400">espera a que el reloj se ponga al día y &#x27;throw&#x27; lanza</text>
<text x="178" y="408" font-size="10.5" fill="#b45309" font-weight="400">ClockDriftException.</text>
<path d="M350.0,408.0 L350.0,432.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="432.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="461.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">offset = t − epoch</text>
<text x="178" y="501" font-size="10.5" fill="#b45309" font-weight="400">offset es la distancia en milisegundos desde la época configurada.</text>
<path d="M350.0,501.0 L350.0,525.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<text x="362" y="517.0" font-size="10.5" fill="#6b7c96" font-weight="600">No</text>
<polygon points="350,525.0 500.0,559.0 350,593.0 200.0,559.0" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="350" y="556.0" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">¿Offset fuera de rango?</text>
<text x="350" y="572.0" font-size="8.3" fill="#6b7c96" font-weight="400" text-anchor="middle">(menor que 0 o por encima del límite)</text>
<text x="178" y="612" font-size="10.5" fill="#b45309" font-weight="400">Sí → un reloj anterior a la época lanza ClockDriftException; una</text>
<text x="178" y="628" font-size="10.5" fill="#b45309" font-weight="400">época agotada lanza TimestampOverflowException.</text>
<path d="M350.0,628.0 L350.0,652.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="652.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="681.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">seq = resolver.next(offset, maxSequence)</text>
<text x="178" y="721" font-size="10.5" fill="#b45309" font-weight="400">Cuando la secuencia se agota (null) avanza al siguiente</text>
<text x="178" y="737" font-size="10.5" fill="#b45309" font-weight="400">milisegundo y reintenta una vez; luego falla con RuntimeException.</text>
<path d="M350.0,737.0 L350.0,761.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="761.0" width="340.0" height="50.0" rx="10" fill="#fff" stroke="#c3d7ff" stroke-width="1.5"/>
<text x="350" y="790.5" font-size="12.5" fill="#0f1e33" font-weight="600" text-anchor="middle">lastTimestamp = t; ensambla el ID</text>
<text x="178" y="830" font-size="10.5" fill="#b45309" font-weight="400">El estado solo avanza cuando pasan todas las guardas, así que</text>
<text x="178" y="846" font-size="10.5" fill="#b45309" font-weight="400">una llamada fallida no contamina la siguiente.</text>
<path d="M350.0,846.0 L350.0,870.0" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" marker-end="url(#mk-5b8def)"/>
<rect x="180.0" y="870.0" width="340.0" height="38.0" rx="19.0" fill="#0f766e"/><text x="350.0" y="893.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">Devuelve un ID único de 64 bits</text>
</svg>
