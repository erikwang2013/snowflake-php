<text x="88" y="142" font-size="18" fill="#0e7490" font-weight="700" letter-spacing="3.2">DISTRIBUTED UNIQUE ID GENERATOR</text>
<text x="88" y="238" font-size="76" font-weight="800" fill="#0f1e33">Snowflake <tspan fill="#2563eb">PHP</tspan></text>
<text x="88" y="292" font-size="28" fill="#5b6b7f" font-weight="400">64-bit · k-ordered · globally unique</text>
<text x="88" y="334" font-size="20" fill="#5b6b7f" font-weight="500">Pure PHP · Zero dependencies · 1M+ IDs/sec per node</text>
<text x="88" y="374" font-size="17" fill="#5b6b7f" font-weight="500">Works with</text>
<text x="192" y="374" font-size="17" fill="#2563eb" font-weight="700">Laravel · Yii2 · Yii3 · Webman · ThinkPHP · Hyperf</text>

